name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    # 1. Tải code từ Repo về máy ảo
    - uses: actions/checkout@v4

    # 2. Thiết lập môi trường PHP
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, dom, curl, libxml, mysql, zip, bcmath, gd
        tools: composer:v2

    # 3. Cấu hình để vượt qua các cảnh báo bảo mật (Audit) của năm 2026
    # Bước này cực kỳ quan trọng để tránh lỗi PKSA-xxx
    - name: Configure Composer Audit
      run: composer config audit.block-insecure false

    # 4. Cài đặt các thư viện từ file composer.lock
    # Dùng lệnh 'install' thay vì 'update' để đảm bảo tính nhất quán
    - name: Install Dependencies
      run: |
        composer config audit.block-insecure false
        composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --ignore-platform-reqs

    # 5. Khởi tạo Application Key
    - name: Generate key
      run: php artisan key:generate

    # 6. Cấp quyền cho thư mục storage và cache
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    # 7. Tạo database giả lập (SQLite) để chạy test
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite

    # 8. Chạy Unit Test / Feature Test
    - name: Execute tests
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test
