name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    # BƯỚC 1: Lấy code từ repo về máy ảo (Phải luôn đứng đầu)
    - uses: actions/checkout@v4

    # BƯỚC 2: Thiết lập môi trường PHP
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, dom, curl, libxml, mysql, zip, bcmath, sqlite3
        tools: composer:v2

    # BƯỚC 3: Cài đặt các thư viện (Sửa lỗi Requirements)
    - name: Install Dependencies
      run: |
        composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --ignore-platform-reqs

    # BƯỚC 4: Chuẩn bị file môi trường
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    # BƯỚC 5: Tạo Key cho ứng dụng
    - name: Generate key
      run: php artisan key:generate

    # BƯỚC 6: Cấp quyền cho các thư mục quan trọng
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    # BƯỚC 7: Tạo Database ảo (SQLite) để chạy Test
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite

    # BƯỚC 8: Chạy Test
    - name: Execute tests
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test
