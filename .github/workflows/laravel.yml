name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    
    # Chỉ định thư mục chứa code thực sự của bạn
    defaults:
      run:
        working-directory: psi.edu.vn

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, dom, curl, libxml, mysql, zip, bcmath, gd
        tools: composer:v2

    # Lưu ý: Các file .env.example cũng phải nằm trong thư mục psi.edu.vn/psi.edu.vn/
    - name: Copy .env file
      run: cp .env.example .env

    - name: Install Dependencies
      run: |
        composer config audit.block-insecure false
        composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --ignore-platform-reqs

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite

    - name: Execute tests
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test
