name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    # 1. Tải code từ GitHub về máy ảo
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Thiết lập môi trường PHP
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, dom, curl, libxml, mysql, zip, bcmath, gd
        tools: composer:v2

    # 3. Tạo file .env từ file .env.example bạn vừa tạo
    # Bước này giúp tránh lỗi "Failed to open stream: No such file or directory"
    - name: Copy .env file
      run: cp .env.example .env

    # 4. Cài đặt các thư viện (Dependencies)
    # Bao gồm lệnh tắt kiểm tra bảo mật để tránh lỗi PKSA năm 2026
    - name: Install Dependencies
      run: |
        composer config audit.block-insecure false
        composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --ignore-platform-reqs

    # 5. Khởi tạo Application Key cho môi trường Test
    - name: Generate key
      run: php artisan key:generate

    # 6. Cấp quyền cho thư mục hệ thống của Laravel
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    # 7. Tạo Database giả lập (SQLite) để chạy test không cần MySQL thật
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite

    # 8. Chạy các bài Test của dự án
    - name: Execute tests (Unit and Feature tests)
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test
