<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trò chơi - Listen and Choose</title>
  <link rel="stylesheet" href="/Game 3/Unit/Unit1/Unit1.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-wrapper">
          <div class="breadcrumb">
            <a href="/Game 3/Game3.html">Phần 3</a> <span> &gt; Unit 9</span>
          </div>
        <h1>TRÒ CHƠI</h1>
        <p>Giúp bé phát triển tiếng Anh một cách tự nhiên</p>
      </header>
<main class="game-content"> 
  <div class="top-bar">
        <a href="/index.html"><button class="btn icon home"><img src="/IMG/Group.png" alt="h" class="home-icon"></button></a>
        <a href="/Game 3/Game3.html">
          <button class="btn icon number">
              <img src="/IMG/Frame 86.png" alt="3" class="number-icon"/>
          </button>
        </a>
        <a href="/Game 3/Unit/Unit8/Unit8.html"><button class="btn nav"><span class="arrow">&laquo;</span></button></a>
        <a href="/Game 3/Unit/Unit9/Unit9.html"><button class="btn nav"><span class="arrow">&raquo;</span></button></a>
    </div>
    <div class="lesson-box">
      <div class="lesson-header">
        <img src="/IMG/Frame 69.png" class="touch-icon">
        <h2>Unit 9: When do we change our clothes?</h2>
      </div>
    <p class="instruction">Listen and match.</p>
    <div class="audio-buttons">
        <button class="audio" data-answer="shirt" data-sound="/Game 3/Unit/Unit9/Sound/shirt.mp3"><strong class="p">shirt</strong></button>
        <button class="audio" data-answer="slippers" data-sound="/Game 3/Unit/Unit9/Sound/slippers.mp3"><strong class="p">slippers</strong></button>
        <button class="audio" data-answer="jeans" data-sound="/Game 3/Unit/Unit9/Sound/jeans.mp3"><strong class="p">jeans</strong></button>
        <button class="audio" data-answer="pajamas" data-sound="/Game 3/Unit/Unit9/Sound/pajamas.mp3"><strong class="p">pajamas</strong></button>
        <button class="audio" data-answer="tracksuit" data-sound="/Game 3/Unit/Unit9/Sound/tracksuit.mp3"><strong class="p">tracksuit</strong></button>
        <button class="audio" data-answer="sneakers" data-sound="/Game 3/Unit/Unit9/Sound/sneakers.mp3"><strong class="p">sneakers</strong></button>
    </div>

    <div class="characters">
      <div class="character" data-name="jeans">
        <img src="/Game 3/Unit/Unit9/img unit/jeans.jpg" alt="jeans" />
      </div>
      <div class="character" data-name="pajamas">
        <img src="/Game 3/Unit/Unit9/img unit/pajamas.jpg" alt="pajamas" />
      </div>
      <div class="character" data-name="shirt">
        <img src="/Game 3/Unit/Unit9/img unit/shirt.jpg" alt="shirt" />
      </div>
      <div class="character" data-name="slippers">
        <img src="/Game 3/Unit/Unit9/img unit/slippers.jpg" alt="slippers" />
      </div>
      <div class="character" data-name="sneakers">
        <img src="/Game 3/Unit/Unit9/img unit/sneakers.jpg" alt="sneakers" />
       </div>
      <div class="character" data-name="tracksuit">
        <img src="/Game 3/Unit/Unit9/img unit/tracksuit.jpg" alt="tracksuit" />
      </div>
    </div>
    <div class="restart-container">
        <button id="restart-button">🔁 Chơi lại</button>
    </div>
    <img src="/IMG/image 60.png" alt="Nhân vật" class="corner-image">
  </div>
</main>
<script>
const answers = [ "shirt", "slippers", "jeans", "pajamas", "tracksuit", "sneakers" ];
let currentAudioIndex = null;

document.querySelectorAll('.audio').forEach((btn, index) => {
  btn.addEventListener('click', () => {
    currentAudioIndex = index;
    new Audio(btn.dataset.sound).play();
  });
});

document.querySelectorAll('.character').forEach(character => {
  character.addEventListener('click', () => {
    if (currentAudioIndex === null) return;

    // Nếu đã chọn đúng rồi thì bỏ qua
    if (character.classList.contains('correct')) return;

    // Xóa trạng thái sai (nếu có)
    character.classList.remove('wrong');
    const selected = character.dataset.name.toLowerCase();
    const correct = answers[currentAudioIndex].toLowerCase();

    if (selected === correct) {
      character.classList.add('correct');

      // ✅ Kiểm tra nếu đã đúng hết 6 hình
      const correctCount = document.querySelectorAll('.character.correct').length;
      if (correctCount === 6) {
        showPopup();
      }
    } else {
      character.classList.add('wrong');
    }
  });
});

// Nút chơi lại
document.getElementById('restart-button').addEventListener('click', () => {
  document.querySelectorAll('.character').forEach(el => {
    el.classList.remove('correct', 'wrong');
  });
  currentAudioIndex = null;
  closePopup();
});

// Hiện popup
function showPopup() {
  document.getElementById("success-popup").classList.remove("hidden");
}

// Đóng popup
function closePopup() {
  document.getElementById("success-popup").classList.add("hidden");
}
</script>
<div id="success-popup" class="popup hidden">
  <div class="popup-content">
    <h2>🎉 Chúc mừng!</h2>
    <p>Bạn đã làm đúng hết rồi!</p>
    <button onclick="closePopup()">Đóng</button>
  </div>
</div>

</body>
</html>
