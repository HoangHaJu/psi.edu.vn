<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trò chơi - Listen and Choose</title>
  <link rel="stylesheet" href="/Game 3/Unit/Unit1/Unit1.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-wrapper">
          <div class="breadcrumb">
            <a href="/Game 3/Game3.html">Phần 3</a> <span> &gt; Unit 7</span>
          </div>
        <h1>TRÒ CHƠI</h1>
        <p>Giúp bé phát triển tiếng Anh một cách tự nhiên</p>
      </header>
<main class="game-content"> 
  <div class="top-bar">
        <a href="/index.html"><button class="btn icon home"><img src="/IMG/Group.png" alt="h" class="home-icon"></button></a>
        <a href="/Game 3/Game3.html">
          <button class="btn icon number">
              <img src="/IMG/Frame 86.png" alt="3" class="number-icon"/>
          </button>
        </a>
        <a href="/Game 3/Unit/Unit6/Unit6.html"><button class="btn nav"><span class="arrow">&laquo;</span></button></a>
        <a href="/Game 3/Unit/Unit8/Unit8.html"><button class="btn nav"><span class="arrow">&raquo;</span></button></a>
    </div>
    <div class="lesson-box">
      <div class="lesson-header">
        <img src="/IMG/Frame 69.png" class="touch-icon">
        <h2>Unit 7: What jobs do people do?</h2>
      </div>
    <p class="instruction">Listen and match.</p>
    <div class="audio-buttons">
        <button class="audio" data-answer="vet" data-sound="/Game 3/Unit/Unit7/Sound/vet.mp3"><strong class="p">vet</strong></button>
        <button class="audio" data-answer="chef" data-sound="/Game 3/Unit/Unit7/Sound/chef.mp3"><strong class="p">chef</strong></button>
        <button class="audio" data-answer="firefighter" data-sound="/Game 3/Unit/Unit7/Sound/firefighter.mp3"><strong class="p">firefighter</strong></button>
        <button class="audio" data-answer="nurse" data-sound="/Game 3/Unit/Unit7/Sound/nurse.mp3"><strong class="p">nurse</strong></button>
        <button class="audio" data-answer="taxi_driver" data-sound="/Game 3/Unit/Unit7/Sound/taxi_driver.mp3"><strong class="p">taxi driver</strong></button>
        <button class="audio" data-answer="police_officer" data-sound="/Game 3/Unit/Unit7/Sound/police_officer.mp3"><strong class="p">police officer</strong></button>
    </div>

    <div class="characters">
      <div class="character" data-name="firefighter">
        <img src="/Game 3/Unit/Unit7/img unit/firefighter.jpg" alt="firefighter" />
      </div>
      <div class="character" data-name="chef">
        <img src="/Game 3/Unit/Unit7/img unit/chef.jpg" alt="chef" />
      </div>
      <div class="character" data-name="police_officer">
        <img src="/Game 3/Unit/Unit7/img unit/police_officer.jpg" alt="police_officer" />
      </div>
      <div class="character" data-name="taxi_driver">
        <img src="/Game 3/Unit/Unit7/img unit/taxi_driver.jpg" alt="taxi_driver" />
      </div>
      <div class="character" data-name="vet">
        <img src="/Game 3/Unit/Unit7/img unit/vet.jpg" alt="vet" />
       </div>
      <div class="character" data-name="nurse">
        <img src="/Game 3/Unit/Unit7/img unit/nurse.jpg" alt="nurse" />
      </div>
    </div>
    <div class="restart-container">
        <button id="restart-button">🔁 Chơi lại</button>
    </div>
    <img src="/IMG/image 60.png" alt="Nhân vật" class="corner-image">
  </div>
</main>
<script>
const answers = [ "vet", "chef", "firefighter", "nurse", "taxi_driver", "police_officer" ];
let currentAudioIndex = null;

document.querySelectorAll('.audio').forEach((btn, index) => {
  btn.addEventListener('click', () => {
    currentAudioIndex = index;
    new Audio(btn.dataset.sound).play();
  });
});

document.querySelectorAll('.character').forEach(character => {
  character.addEventListener('click', () => {
    if (currentAudioIndex === null) return;

    // Nếu đã chọn đúng rồi thì bỏ qua
    if (character.classList.contains('correct')) return;

    // Xóa trạng thái sai (nếu có)
    character.classList.remove('wrong');
    const selected = character.dataset.name.toLowerCase();
    const correct = answers[currentAudioIndex].toLowerCase();

    if (selected === correct) {
      character.classList.add('correct');

      // ✅ Kiểm tra nếu đã đúng hết 6 hình
      const correctCount = document.querySelectorAll('.character.correct').length;
      if (correctCount === 6) {
        showPopup();
      }
    } else {
      character.classList.add('wrong');
    }
  });
});

// Nút chơi lại
document.getElementById('restart-button').addEventListener('click', () => {
  document.querySelectorAll('.character').forEach(el => {
    el.classList.remove('correct', 'wrong');
  });
  currentAudioIndex = null;
  closePopup();
});

// Hiện popup
function showPopup() {
  document.getElementById("success-popup").classList.remove("hidden");
}

// Đóng popup
function closePopup() {
  document.getElementById("success-popup").classList.add("hidden");
}
</script>
<div id="success-popup" class="popup hidden">
  <div class="popup-content">
    <h2>🎉 Chúc mừng!</h2>
    <p>Bạn đã làm đúng hết rồi!</p>
    <button onclick="closePopup()">Đóng</button>
  </div>
</div>

</body>
</html>
