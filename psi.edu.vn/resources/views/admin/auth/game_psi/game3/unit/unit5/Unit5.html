<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trò chơi - Listen and Choose</title>
  <link rel="stylesheet" href="/Game 3/Unit/Unit1/Unit1.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-wrapper">
          <div class="breadcrumb">
            <a href="/Game 3/Game3.html">Phần 3</a> <span> &gt; Unit 5</span>
          </div>
        <h1>TRÒ CHƠI</h1>
        <p>Giúp bé phát triển tiếng Anh một cách tự nhiên</p>
      </header>
<main class="game-content"> 
  <div class="top-bar">
        <a href="/index.html"><button class="btn icon home"><img src="/IMG/Group.png" alt="h" class="home-icon"></button></a>
        <a href="/Game 3/Game3.html">
          <button class="btn icon number">
              <img src="/IMG/Frame 86.png" alt="3" class="number-icon"/>
          </button>
        </a>
        <a href="/Game 3/Unit/Unit4/Unit4.html"><button class="btn nav"><span class="arrow">&laquo;</span></button></a>
        <a href="/Game 3/Unit/Unit6/Unit6.html"><button class="btn nav"><span class="arrow">&raquo;</span></button></a>
    </div>
    <div class="lesson-box">
      <div class="lesson-header">
        <img src="/IMG/Frame 69.png" class="touch-icon">
        <h2>Unit 5: How do you have fun?</h2>
      </div>
    <p class="instruction">Listen and match.</p>
    <div class="audio-buttons">
        <button class="audio" data-answer="dance" data-sound="/Game 3/Unit/Unit5/Sound/dance.mp3"><strong class="p">dance</strong></button>
        <button class="audio" data-answer="ride_a_scooter" data-sound="/Game 3/Unit/Unit5/Sound/ride_a_scooter.mp3"><strong class="p">ride a scooter</strong></button>
        <button class="audio" data-answer="run" data-sound="/Game 3/Unit/Unit5/Sound/run.mp3"><strong class="p">run</strong></button>
        <button class="audio" data-answer="jump rope" data-sound="/Game 3/Unit/Unit5/Sound/jump_rope.mp3"><strong class="p">jump rope</strong></button>
        <button class="audio" data-answer="ride a bike" data-sound="/Game 3/Unit/Unit5/Sound/ride_a_bike.mp3"><strong class="p">ride a bike</strong></button>
        <button class="audio" data-answer="roller skate" data-sound="/Game 3/Unit/Unit5/Sound/roller_skate.mp3"><strong class="p">roller skate</strong></button>
    </div>

    <div class="characters">
      <div class="character" data-name="ride a bike">
        <img src="/Game 3/Unit/Unit5/img unit/ride_a_bike.jpg" alt="ride a bike" />
      </div>
      <div class="character" data-name="dance">
        <img src="/Game 3/Unit/Unit5/img unit/dance.jpg" alt="dance" />
      </div>
      <div class="character" data-name="ride a ride_a_scooter">
        <img src="/Game 3/Unit/Unit5/img unit/ride_a_scooter.jpg" alt="ride a ride_a_scooter" />
      </div>
      <div class="character" data-name="jump rope">
        <img src="/Game 3/Unit/Unit5/img unit/jump_rope.jpg" alt="jump rope" />
      </div>
      <div class="character" data-name="run">
        <img src="/Game 3/Unit/Unit5/img unit/run2.jpg" alt="run" />
       </div>
      <div class="character" data-name="roller skate">
        <img src="/Game 3/Unit/Unit5/img unit/roller_skate.jpg" alt="roller skate" />
      </div>
    </div>
    <div class="restart-container">
        <button id="restart-button">🔁 Chơi lại</button>
    </div>
    <img src="/IMG/image 60.png" alt="Nhân vật" class="corner-image">
  </div>
</main>
<script>
const answers = [ "dance", "ride a ride_a_scooter", "run", "jump rope", "ride a bike", "roller skate" ];
let currentAudioIndex = null;

document.querySelectorAll('.audio').forEach((btn, index) => {
  btn.addEventListener('click', () => {
    currentAudioIndex = index;
    new Audio(btn.dataset.sound).play();
  });
});

document.querySelectorAll('.character').forEach(character => {
  character.addEventListener('click', () => {
    if (currentAudioIndex === null) return;

    // Nếu đã chọn đúng rồi thì bỏ qua
    if (character.classList.contains('correct')) return;

    // Xóa trạng thái sai (nếu có)
    character.classList.remove('wrong');
    const selected = character.dataset.name.toLowerCase();
    const correct = answers[currentAudioIndex].toLowerCase();

    if (selected === correct) {
      character.classList.add('correct');

      // ✅ Kiểm tra nếu đã đúng hết 6 hình
      const correctCount = document.querySelectorAll('.character.correct').length;
      if (correctCount === 6) {
        showPopup();
      }
    } else {
      character.classList.add('wrong');
    }
  });
});

// Nút chơi lại
document.getElementById('restart-button').addEventListener('click', () => {
  document.querySelectorAll('.character').forEach(el => {
    el.classList.remove('correct', 'wrong');
  });
  currentAudioIndex = null;
  closePopup();
});

// Hiện popup
function showPopup() {
  document.getElementById("success-popup").classList.remove("hidden");
}

// Đóng popup
function closePopup() {
  document.getElementById("success-popup").classList.add("hidden");
}
</script>
<div id="success-popup" class="popup hidden">
  <div class="popup-content">
    <h2>🎉 Chúc mừng!</h2>
    <p>Bạn đã làm đúng hết rồi!</p>
    <button onclick="closePopup()">Đóng</button>
  </div>
</div>

</body>
</html>
